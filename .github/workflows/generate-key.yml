name: Generate Permanent Keystore

on:
  workflow_dispatch:

jobs:
  gen-key:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Generate keystore and print Base64
        run: |
          keytool -genkeypair -v \
            -keystore birge-release.keystore \
            -alias birge \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass birge123456 \
            -keypass birge123456 \
            -dname "CN=Birge, OU=School, O=Birge, L=Astana, S=Astana, C=KZ"

          echo "=== СКОПИРУЙ СТРОКУ НИЖЕ В SECRET BIRGE_KEYSTORE_BASE64 ==="
          base64 -w 0 birge-release.keystore
          echo ""
