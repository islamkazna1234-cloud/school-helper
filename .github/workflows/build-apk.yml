name: Build Birge Standalone APK (Capacitor)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-capacitor-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Android SDK components
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools" "$ANDROID_HOME/licenses"
          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
            unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
            rm -rf "$ANDROID_HOME/cmdline-tools/latest"
            mv /tmp/cmdtools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          fi
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "build-tools;34.0.0" \
            "platforms;android-34"

      - name: Bundle web assets into www folder
        run: |
          mkdir -p www
          cp index.html www/
          [ -f manifest.json ] && cp manifest.json www/ || true
          [ -f sw.js ] && cp sw.js www/ || true
          [ -d icons ] && cp -r icons www/ || true
          [ -d assets ] && cp -r assets www/ || true
          [ -d css ] && cp -r css www/ || true
          [ -d js ] && cp -r js www/ || true

      - name: Initialize Capacitor and add Android platform
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets
          npx cap init "Birge" "kz.school.birge" --web-dir=www
          npx cap add android

      - name: Generate native app icons
        run: |
          mkdir -p assets
          if [ ! -f assets/icon.png ] && [ -f icons/icon-512.png ]; then
            cp icons/icon-512.png assets/icon.png
          fi
          if [ -f assets/icon.png ]; then
            npx capacitor-assets generate --android --iconBackgroundColor '#2b4acb' --iconBackgroundColorDark '#0f1424'
          else
            echo "WARNING: No icon file found in assets/icon.png or icons/icon-512.png"
          fi
          npx cap sync android

      - name: Decode permanent keystore and build signed APK
        env:
          KEYSTORE_B64: ${{ secrets.BIRGE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "ERROR: Secret BIRGE_KEYSTORE_BASE64 is missing!"
            exit 1
          fi

          echo "$KEYSTORE_B64" | base64 -d > android/birge-release.keystore

          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$(pwd)/birge-release.keystore" \
            -Pandroid.injected.signing.store.password=birge123456 \
            -Pandroid.injected.signing.key.alias=birge \
            -Pandroid.injected.signing.key.password=birge123456

      - name: Upload standalone APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Birge-Standalone-APK
          path: android/app/build/outputs/apk/release/app-release*.apk
