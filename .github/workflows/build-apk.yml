name: Build Birge APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Android SDK components
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools" "$ANDROID_HOME/licenses"
          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
            unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
            rm -rf "$ANDROID_HOME/cmdline-tools/latest"
            mv /tmp/cmdtools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          fi
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "build-tools;34.0.0" \
            "platforms;android-34"

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Decode permanent keystore and write TWA config
        env:
          KEYSTORE_B64: ${{ secrets.BIRGE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "ERROR: Secret BIRGE_KEYSTORE_BASE64 is missing!"
            exit 1
          fi

          mkdir -p ~/.bubblewrap twa-build
          echo "$KEYSTORE_B64" | base64 -d > twa-build/birge-release.keystore

          cat << EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF

          cat << 'EOF' > twa-build/twa-manifest.json
          {
            "packageId": "kz.school.birge",
            "host": "islamkazna1234-cloud.github.io",
            "name": "Birge — школьная взаимопомощь",
            "launcherName": "Birge",
            "display": "standalone",
            "themeColor": "#2b4acb",
            "themeColorDark": "#0f1424",
            "navigationColor": "#ffffff",
            "navigationColorDark": "#182036",
            "navigationDividerColor": "#e2e5ee",
            "navigationDividerColorDark": "#2b3552",
            "backgroundColor": "#f5f6fa",
            "enableNotifications": false,
            "startUrl": "/school-helper/",
            "iconUrl": "https://islamkazna1234-cloud.github.io/school-helper/icons/icon-512.png",
            "maskableIconUrl": "https://islamkazna1234-cloud.github.io/school-helper/icons/icon-maskable-512.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "./birge-release.keystore",
              "alias": "birge"
            },
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://islamkazna1234-cloud.github.io/school-helper/manifest.json",
            "fallbackType": "customtabs",
            "features": {},
            "alphaDependencies": {
              "enabled": false
            },
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "fullScopeUrl": "https://islamkazna1234-cloud.github.io/school-helper/",
            "minSdkVersion": 24,
            "orientation": "portrait"
          }
          EOF

      - name: Generate Android project and build release APK via Gradle
        run: |
          cd twa-build
          bubblewrap update --skipVersionUpgrade --skipPwaValidation || true
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$(pwd)/birge-release.keystore" \
            -Pandroid.injected.signing.store.password=birge123456 \
            -Pandroid.injected.signing.key.alias=birge \
            -Pandroid.injected.signing.key.password=birge123456

      - name: Extract SHA-256 from APK and generate assetlinks.json
        run: |
          APK_PATH=$(ls twa-build/app/build/outputs/apk/release/app-release*.apk | head -n 1)
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          SHA256_RAW=$("$APKSIGNER" verify --print-certs "$APK_PATH" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print toupper($2); exit}')
          SHA256=$(echo "$SHA256_RAW" | sed 's/\(..\)/\1:/g; s/:$//')

          if [ -z "$SHA256" ]; then
            echo "ERROR: Could not extract SHA-256 from APK"
            exit 1
          fi

          mkdir -p assetlinks-site/.well-known
          touch assetlinks-site/.nojekyll
          cat << EOF > assetlinks-site/.well-known/assetlinks.json
          [
            {
              "relation": ["delegate_permission/common.handle_all_urls"],
              "target": {
                "namespace": "android_app",
                "package_name": "kz.school.birge",
                "sha256_cert_fingerprints": [
                  "$SHA256"
                ]
              }
            }
          ]
          EOF
          cat assetlinks-site/.well-known/assetlinks.json

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Birge-Android-APK
          path: twa-build/app/build/outputs/apk/release/app-release*.apk

      - name: Upload assetlinks site artifact
        uses: actions/upload-artifact@v4
        with:
          name: Birge-assetlinks
          path: assetlinks-site/
          include-hidden-files: true
