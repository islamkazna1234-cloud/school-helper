name: Build Birge APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Android SDK packages and accept licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          SDKMANAGER_BIN="$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -n 1)"

          if [ -z "$SDKMANAGER_BIN" ]; then
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
            unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
            mv /tmp/cmdtools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
            SDKMANAGER_BIN="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi

          chmod +x "$SDKMANAGER_BIN"
          export PATH="$(dirname "$SDKMANAGER_BIN"):$ANDROID_HOME/platform-tools:$PATH"
          echo "$(dirname "$SDKMANAGER_BIN")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER_BIN" --sdk_root="$ANDROID_HOME" --licenses || true
          yes | "$SDKMANAGER_BIN" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "build-tools;34.0.0" \
            "platforms;android-34" \
            "cmdline-tools;latest"

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap global paths
        run: |
          mkdir -p ~/.bubblewrap
          cat << EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF

      - name: Create signing keystore and TWA config
        run: |
          mkdir -p twa-build
          keytool -genkeypair -v \
            -keystore twa-build/birge-release.keystore \
            -alias birge \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass birge123456 \
            -keypass birge123456 \
            -dname "CN=Birge, OU=School, O=Birge, L=Astana, S=Astana, C=KZ"

          cat << 'EOF' > twa-build/twa-manifest.json
          {
            "packageId": "kz.school.birge",
            "host": "islamkazna1234-cloud.github.io",
            "name": "Birge — школьная взаимопомощь",
            "launcherName": "Birge",
            "display": "standalone",
            "themeColor": "#2b4acb",
            "themeColorDark": "#0f1424",
            "navigationColor": "#ffffff",
            "navigationColorDark": "#182036",
            "navigationDividerColor": "#e2e5ee",
            "navigationDividerColorDark": "#2b3552",
            "backgroundColor": "#f5f6fa",
            "enableNotifications": false,
            "startUrl": "/school-helper/",
            "iconUrl": "https://islamkazna1234-cloud.github.io/school-helper/icons/icon-512.png",
            "maskableIconUrl": "https://islamkazna1234-cloud.github.io/school-helper/icons/icon-maskable-512.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "./birge-release.keystore",
              "alias": "birge"
            },
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://islamkazna1234-cloud.github.io/school-helper/manifest.json",
            "fallbackType": "customtabs",
            "features": {},
            "alphaDependencies": {
              "enabled": false
            },
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "fullScopeUrl": "https://islamkazna1234-cloud.github.io/school-helper/",
            "minSdkVersion": 21,
            "orientation": "portrait"
          }
          EOF

      - name: Generate Android project & Build APK
        run: |
          cd twa-build
          yes | bubblewrap update --skipVersionUpgrade
          printf "birge123456\nbirge123456\n" | bubblewrap build --skipPwaValidation

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Birge-Android-APK
          path: twa-build/app-release-signed.apk
